#
# Reusable workflow which verifies the PR conforms to project conventions.
#
# Permissions required:
#   pull-requests: read
#
name: Pull Request

on:
  workflow_call

defaults:
  run:
    shell: bash

jobs:
  main:
    name: Check Pull Request Title (semantic)
    # See <https://github.com/pdfclown/pdfclown-common/blob/main/docs/common/scm.md#pull-requests>.
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Semantic PR type MUST correspond to a commit type defined in
          # <https://github.com/pdfclown/pdfclown-common/blob/main/docs/common/scm.md#commit-types>.
          types: |
            build
            bump
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          # Semantic PR scope MUST correspond to a commit scope defined in
          # <https://github.com/pdfclown/pdfclown-common/blob/main/docs/common/scm.md#commit-scopes>.
          scopes: |
            base
            build
            deps
            deps-dev
            parent
            super
            util
